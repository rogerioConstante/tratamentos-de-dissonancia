<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercícios de Tratamento de Dissonâncias v26.04.6</title>
    
    <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a1a; color: #e0e0e0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; background: #2d2d2d; border-radius: 12px; overflow: hidden; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        .header { background: #1e1e1e; padding: 20px; text-align: center; border-bottom: 2px solid #3a6ea5; }
        .config-panel { background: #252525; padding: 15px; display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; border-bottom: 1px solid #3a3a3a; }
        .config-group { display: flex; align-items: center; gap: 8px; }
        input, select { background: #1e1e1e; color: white; border: 1px solid #3a6ea5; padding: 5px; border-radius: 4px; }
        .button-panel { padding: 15px; display: flex; gap: 10px; justify-content: center; background: #1e1e1e; }
        button { padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .success { background: #3a8b5a; color: white; }
        .primary { background: #3a6ea5; color: white; }
        .danger { background: #8b3a3a; color: white; }
        .score-area { background: white; padding: 20px; margin: 20px; border-radius: 8px; display: flex; justify-content: center; }
        .virtual-piano { padding: 20px; text-align: center; }
        .piano-keys { display: flex; justify-content: center; overflow-x: auto; padding-bottom: 10px; }
        .key { width: 35px; height: 120px; border: 1px solid #000; background: white; cursor: pointer; display: flex; align-items: flex-end; justify-content: center; color: #333; font-size: 10px; border-radius: 0 0 4px 4px; }
        .key.black { width: 25px; height: 75px; background: #333; color: white; margin-left: -12.5px; margin-right: -12.5px; z-index: 2; }
        .key:hover { background: #eee; }
        .key.black:hover { background: #555; }
        .answers-area { padding: 20px; background: #252525; margin: 20px; border-radius: 8px; }
        .alternatives { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 15px; }
        .alt-btn { background: #3a3a3a; color: white; text-align: left; }
        .alt-btn.correct { background: #3a8b5a !important; }
        .alt-btn.wrong { background: #8b3a3a !important; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🎵 Contraponto & Dissonâncias v26.04.6</h1>
        <p>Prof. Rogério Tavares Constante</p>
    </div>

    <div class="config-panel">
        <div class="config-group">
            <label>Nome:</label>
            <input type="text" id="student-name" placeholder="Seu nome">
        </div>
        <div class="config-group">
            <label>Espécie:</label>
            <select id="species-select">
                <option value="2">2ª Espécie</option>
            </select>
        </div>
        <div class="config-group">
            <label>Tom:</label>
            <span id="tonality-display" style="color:#3a6ea5; font-weight:bold;">C Maior</span>
        </div>
    </div>

    <div class="button-panel">
        <button id="start-btn" class="success">INICIAR</button>
        <button id="play-btn" class="primary" disabled>🔊 OUVIR</button>
        <button id="next-btn" class="primary" disabled>PRÓXIMA</button>
    </div>

    <div class="score-area">
        <div id="notation"></div>
    </div>

    <div class="virtual-piano" id="piano-container" style="display:none;">
        <p style="margin-bottom:10px;">Monte seu contraponto (C3 = Dó Central):</p>
        <div class="piano-keys" id="piano-keys"></div>
        <div id="user-notes-display" style="margin-top:10px; font-weight:bold; color:#3a6ea5;"></div>
    </div>

    <div class="answers-area" id="answers-section">
        <h3 id="question-text">Clique em iniciar para começar.</h3>
        <div class="alternatives" id="alternatives"></div>
    </div>
</div>

<script>
    // --- CONSTANTES DE TEORIA ---
    const NOTES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
    const CONSONANCIAS = [0, 3, 4, 7, 8, 9, 12, 15, 16]; // Semitons (inclui uníssono 0)
    
    // Configurações Globais
    let state = {
        name: "",
        tonality: { name: "C Maior", tonic: "C", type: "major", scale: [] },
        currentQuestion: null,
        userNotes: [],
        score: 0,
        index: 0,
        total: 10
    };

    // --- UTILITÁRIOS DE MAPEAMENTO ---
    // Mapeia C3 (BR) para C4 (VexFlow)
    function toVex(note, octave) {
        return `${note.toLowerCase()}/${octave + 1}`;
    }

    function toFreq(note, octave) {
        return `${note}${octave + 1}`;
    }

    function getSemitones(noteVex) {
        const [n, o] = noteVex.split('/');
        return NOTES.indexOf(n.toUpperCase()) + (parseInt(o) * 12);
    }

    // --- GERADOR DE ESCALA ---
    function generateScale(tonic, type) {
        const intervals = type === 'major' ? [0, 2, 4, 5, 7, 9, 11] : [0, 2, 3, 5, 7, 8, 10];
        const startIndex = NOTES.indexOf(tonic);
        return intervals.map(i => {
            const idx = (startIndex + i) % 12;
            return NOTES[idx];
        });
    }

    // --- LÓGICA MUSICAL ---
    function isConsonant(v1, v2) {
        const diff = Math.abs(getSemitones(v1) - getSemitones(v2)) % 12;
        return [0, 3, 4, 7, 8, 9].includes(diff);
    }

    function generateCantus() {
        const isUpper = Math.random() > 0.5;
        const clef = isUpper ? 'treble' : 'bass';
        const scale = state.tonality.scale;
        
        // Limites estritos conforme pedido
        const minVex = isUpper ? getSemitones('b/3') : getSemitones('e/2');
        const maxVex = isUpper ? getSemitones('a/5') : getSemitones('d/4');

        let n1, n2;
        do {
            const note1 = scale[Math.floor(Math.random() * scale.length)];
            const oct1 = isUpper ? (Math.random() > 0.5 ? 3 : 4) : (Math.random() > 0.5 ? 1 : 2);
            n1 = toVex(note1, oct1);
            
            const note2 = scale[Math.floor(Math.random() * scale.length)];
            const oct2 = isUpper ? (Math.random() > 0.5 ? 3 : 4) : (Math.random() > 0.5 ? 1 : 2);
            n2 = toVex(note2, oct2);
        } while (
            getSemitones(n1) < minVex || getSemitones(n1) > maxVex ||
            getSemitones(n2) < minVex || getSemitones(n2) > maxVex ||
            Math.abs(getSemitones(n1) - getSemitones(n2)) === 10 || // Proibe 7ª (10 ou 11 semitons)
            Math.abs(getSemitones(n1) - getSemitones(n2)) === 11 ||
            Math.abs(getSemitones(n1) - getSemitones(n2)) > 12     // Âmbito máx 8ª
        );

        return { notes: [n1, n2], clef, position: isUpper ? 'superior' : 'inferior' };
    }

    function generateExercise() {
        const cantus = generateCantus();
        const tipos = ['Nota de Passagem', 'Bordadura Superior', 'Bordadura Inferior'];
        const escolhido = tipos[Math.floor(Math.random() * tipos.length)];
        
        // Gerar contraponto automático para Tipos A e B
        const cpClef = cantus.clef === 'treble' ? 'bass' : 'treble';
        let cp = [];
        
        // Lógica simplificada para garantir consonância na cabeça
        const scale = state.tonality.scale;
        let p1, d1, r1;
        
        // Procura uma preparação consonante
        for(let n of scale) {
            let tryP1 = toVex(n, cantus.clef === 'treble' ? 2 : 4);
            if(isConsonant(tryP1, cantus.notes[0])) {
                p1 = tryP1;
                break;
            }
        }

        if(escolhido === 'Nota de Passagem') {
            // Sobe ou desce 3ª
            const dir = Math.random() > 0.5 ? 1 : -1;
            const idx = scale.indexOf(p1.split('/')[0].toUpperCase());
            d1 = toVex(scale[(idx + dir + 7) % 7], parseInt(p1.split('/')[1]) - 1);
            r1 = toVex(scale[(idx + dir*2 + 7) % 7], parseInt(p1.split('/')[1]) - 1);
        } else {
            const dir = escolhido === 'Bordadura Superior' ? 1 : -1;
            const idx = scale.indexOf(p1.split('/')[0].toUpperCase());
            d1 = toVex(scale[(idx + dir + 7) % 7], parseInt(p1.split('/')[1]) - 1);
            r1 = p1;
        }

        cp = [{n: p1, d: 'h'}, {n: d1, d: 'h'}, {n: r1, d: 'w'}];

        return { cantus, contraponto: cp, tipo: escolhido, mode: Math.random() > 0.5 ? 'auditiva' : 'analise' };
    }

    // --- RENDERIZAÇÃO ---
    function draw(cantus, cp) {
        const div = document.getElementById('notation');
        div.innerHTML = "";
        const renderer = new Vex.Flow.Renderer(div, Vex.Flow.Renderer.Backends.SVG);
        renderer.resize(500, 250);
        const context = renderer.getContext();

        const topClef = cantus.position === 'superior' ? cantus.clef : (cantus.clef === 'treble' ? 'bass' : 'treble');
        const botClef = cantus.position === 'inferior' ? cantus.clef : (cantus.clef === 'treble' ? 'bass' : 'treble');

        const staveTop = new Vex.Flow.Stave(10, 40, 400).addClef(topClef).setContext(context).draw();
        const staveBot = new Vex.Flow.Stave(10, 140, 400).addClef(botClef).setContext(context).draw();

        const voiceTop = new Vex.Flow.Voice({num_beats: 4, beat_value: 4});
        const voiceBot = new Vex.Flow.Voice({num_beats: 4, beat_value: 4});

        const notesTop = [];
        const notesBot = [];

        // Distribuir notas
        if(cantus.position === 'superior') {
            notesTop.push(new Vex.Flow.StaveNote({clef: topClef, keys: [cantus.notes[0]], duration: "w"}));
            cp.slice(0,2).forEach(c => notesBot.push(new Vex.Flow.StaveNote({clef: botClef, keys: [c.n], duration: c.d})));
        } else {
            notesBot.push(new Vex.Flow.StaveNote({clef: botClef, keys: [cantus.notes[0]], duration: "w"}));
            cp.slice(0,2).forEach(c => notesTop.push(new Vex.Flow.StaveNote({clef: topClef, keys: [c.n], duration: c.d})));
        }

        voiceTop.addTickables(notesTop);
        voiceBot.addTickables(notesBot);
        new Vex.Flow.Formatter().joinVoices([voiceTop, voiceBot]).format([voiceTop, voiceBot], 350);
        
        voiceTop.draw(context, staveTop);
        voiceBot.draw(context, staveBot);
    }

    // --- PIANO VIRTUAL ---
    function createPiano() {
        const container = document.getElementById('piano-keys');
        container.innerHTML = "";
        const octaves = [2, 3, 4]; // Focado no entorno do C3
        
        octaves.forEach(oct => {
            NOTES.forEach(note => {
                const isBlack = note.includes('#');
                const key = document.createElement('div');
                key.className = `key ${isBlack ? 'black' : ''}`;
                key.innerHTML = `<span>${note}${oct}</span>`;
                key.onclick = () => {
                    if(state.userNotes.length < 3) {
                        const dur = state.userNotes.length < 2 ? 'h' : 'w';
                        state.userNotes.push({n: toVex(note, oct), d: dur});
                        document.getElementById('user-notes-display').innerText = 
                            "Notas: " + state.userNotes.map(n => n.n.replace('/','')).join(', ');
                        updatePreview();
                    }
                };
                container.appendChild(key);
            });
        });
    }

    function updatePreview() {
        if(state.currentQuestion) {
            draw(state.currentQuestion.cantus, state.userNotes);
        }
    }

    // --- FLUXO DE JOGO ---
    function startQuestion() {
        state.userNotes = [];
        state.currentQuestion = generateExercise();
        document.getElementById('play-btn').disabled = false;
        
        const q = state.currentQuestion;
        if(q.mode === 'auditiva') {
            document.getElementById('question-text').innerText = "Ouça o exemplo e identifique a dissonância:";
            document.getElementById('notation').style.visibility = "hidden";
        } else {
            document.getElementById('question-text').innerText = "Analise a partitura e identifique o tratamento:";
            document.getElementById('notation').style.visibility = "visible";
        }
        
        draw(q.cantus, q.contraponto);
        renderAlternatives();
    }

    function renderAlternatives() {
        const container = document.getElementById('alternatives');
        container.innerHTML = "";
        const options = ['Nota de Passagem', 'Bordadura Superior', 'Bordadura Inferior', 'Sem Dissonância'];
        
        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = "alt-btn";
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(opt, btn);
            container.appendChild(btn);
        });
    }

    function checkAnswer(choice, btn) {
        const correct = state.currentQuestion.tipo;
        if(choice === correct) {
            btn.classList.add('correct');
            state.score++;
        } else {
            btn.classList.add('wrong');
        }
        document.getElementById('next-btn').disabled = false;
        document.getElementById('notation').style.visibility = "visible";
    }

    async function playAudio() {
        await Tone.start();
        const synth = new Tone.PolySynth().toDestination();
        const now = Tone.now();
        const q = state.currentQuestion;

        // Toca Cantus
        synth.triggerAttackRelease(toFreq(q.cantus.notes[0].split('/')[0], parseInt(q.cantus.notes[0].split('/')[1])-1), "1n", now);
        
        // Toca Contraponto
        let time = 0;
        q.contraponto.forEach(note => {
            const freq = toFreq(note.n.split('/')[0], parseInt(note.n.split('/')[1])-1);
            synth.triggerAttackRelease(freq, note.d === 'h' ? "2n" : "1n", now + time);
            time += (note.d === 'h' ? 1 : 2);
        });
    }

    // Eventos
    document.getElementById('start-btn').onclick = () => {
        state.name = document.getElementById('student-name').value;
        if(!state.name) return alert("Digite seu nome");
        state.tonality.scale = generateScale('C', 'major');
        startQuestion();
        document.getElementById('start-btn').disabled = true;
    };

    document.getElementById('next-btn').onclick = () => {
        state.index++;
        document.getElementById('next-btn').disabled = true;
        startQuestion();
    };

    document.getElementById('play-btn').onclick = playAudio;

    createPiano();
</script>
</body>
</html>
